[project]
name = "autoseguro-agent"
version = "1.0.0"
description = "Agente auditavel de qualificacao e cotacao para a AutoSeguro"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14",
    "anthropic>=0.49",
    "fastapi>=0.115",
    "httpx>=0.28",
    "openai>=1.68",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.8",
    "sqlalchemy>=2.0",
    "typer>=0.15",
    "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
agents = [
    "openai-agents==0.22.0",
]
redis = [
    "redis>=5.2",
]
observability = [
    "opentelemetry-api>=1.36",
    "opentelemetry-exporter-otlp-proto-http>=1.36",
    "opentelemetry-sdk>=1.36",
]
policy = [
    "cedarpy>=4.8.7",
]
dev = [
    "aiosqlite>=0.21",
    "fakeredis>=2.31",
    "mypy>=1.15",
    "pandas>=2.2",
    "pip-audit>=2.10",
    "pyarrow>=19",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "ruff>=0.11",
]

[project.scripts]
autoseguro = "autoseguro.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoseguro"]

[tool.pytest.ini_options]
addopts = "-q --disable-warnings --strict-markers"
testpaths = ["tests"]
markers = ["integration: requires a real local PostgreSQL instance"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "cedarpy"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["opentelemetry.exporter.*", "opentelemetry.sdk.*"]
ignore_missing_imports = true
